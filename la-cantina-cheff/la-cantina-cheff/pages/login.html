<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Cantina Cheff – Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f5e6d3; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { max-width: 380px; width: 100%; }
    .brand-title { color: #c0392b; font-weight: 800; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="card shadow-lg border-0">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-cup-hot-fill fs-1 text-danger"></i>
          <h4 class="brand-title mt-2">La Cantina Cheff</h4>
          <p class="text-muted small">Área do Administrador</p>
        </div>
        <div class="mb-3">
          <label class="form-label">Usuário</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" placeholder="admin">
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">Senha</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" placeholder="••••••••">
          </div>
        </div>
        <a href="../index.html" class="btn btn-danger w-100">
          <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
        </a>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
